<title>Harfogram</title>
<!--
  Davet sayfası — uygulamadaki davet linkleri buraya gelir (ShareManager.inviteLinkBase):
    ?ref=<PlayFabId>   "Davet Et, Kazan" (ikiniz de altın)
    ?room=<oda kodu>   özel oda daveti
  Uygulama kuruluysa link doğrudan uygulamayı açar (App Links / Universal Links), bu sayfa yalnızca
  uygulaması olmayan için.
  Android: Play linkine referrer=utm_source=invite|room&utm_medium=referral&ref=…&room=… eklenir —
    Play kurulumdan sonra bunu uygulamaya verir (InstallReferrer.cs): davet kodu kendiliğinden gelir,
    oda davetine 30 dk içinde kurulursa odaya katılınır.
  iPhone: karşılığı yok — "Kodu Kopyala ve App Store'a Git" kodu panoya kopyalar; giriş ekranında
    "Davet kodun var mı?" → "Panodan yapıştır" (LoginPanel). App Store linkinde ct=invite|room
    (App Store Connect → Kampanyalar).
  Metinler 16 dilde (tarayıcı diline göre, yoksa İngilizce). Uygulamadaki ifadelerle aynı tutulmalı:
  login_referral_label ve login_referral_paste.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1117;
    color: #E6EDF3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 8px;
    color: #4DB3FF;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: #A9B4C4;
    margin: 0 0 24px;
  }
  .note {
    display: none;
    background: rgba(77, 179, 255, 0.10);
    border: 1px solid rgba(77, 179, 255, 0.35);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.5;
    color: #E6EDF3;
  }
  .code {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    color: #A9B4C4;
    word-break: break-all;
  }
  .code strong { color: #E6EDF3; letter-spacing: 0.5px; }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 14px;
    border: 0;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: #4DB3FF; color: #0D1117; }
  .btn-secondary {
    background: transparent;
    color: #A9B4C4;
    border: 1px solid #2A3546;
  }
  .hidden { display: none !important; }
</style>

        legacyCopy(text);
        go();

      function legacyCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        try { document.execCommand("copy"); } catch (e) { /* kod sayfada görünüyor */ }
        document.body.removeChild(ta);
      }

      if (isIOS) {
        primary.href = storeUrl;
        if (ref && !room) {
          primary.textContent = L.copyGo;
          primary.addEventListener("click", function (e) { e.preventDefault(); copyThenGo(ref, storeUrl); });
        } else {
          primary.textContent = L.store;
        }
        secondary.href = playUrl;
        secondary.textContent = L.android;
      } else if (isAndroid) {
        primary.href = playUrl;
        primary.textContent = L.play;
        secondary.href = storeUrl;
        secondary.textContent = L.iphone;
      } else {
        primary.href = playUrl;
        primary.textContent = L.play;
        secondary.href = storeUrl;
        secondary.textContent = L.store;
      }
    })();
  </script>
</body>
</html>
