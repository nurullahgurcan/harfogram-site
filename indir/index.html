<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Harfogram — İndir</title>
<meta property="og:title" content="Harfogram">
<meta property="og:description" content="Arkadaşlarınla, yapay zekâya karşı ya da aynı telefonda oynanan kelime oyunu.">
<meta property="og:image" content="https://harfogram.com/logo.png">
<link rel="icon" href="/logo.png">
<!--
  Sosyal medya / reklam bağlantısı: harfogram.com/indir/?k=<kaynak>
  Telefonda doğrudan mağazaya gider, kaynak mağazanın kendi kampanya ölçümüne yazılır:
    App Store   → ct=<kaynak> (App Store Connect → Analiz → Kaynaklar → Kampanyalar; pt gerekli)
    Google Play → referrer=utm_source=<kaynak>&utm_medium=social (Play Console → edinme raporları)
  Sayfa hiçbir izleme kodu çalıştırmaz, çerez yazmaz.
-->
<style>
  :root {
    color-scheme: dark;
    --navy: #141043; --purple: #3a1466; --cream: #f6edda; --cream-dim: #cabfe6;
    --pink: #ff3d8b; --cyan: #2bd6e6; --gold: #ffc24b; --lime: #b6f24a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; color: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, var(--purple) 100%) fixed;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .logo { width: 260px; max-width: 80%; height: auto; margin: 0 auto 20px; display: block; }
  p { color: var(--cream-dim); line-height: 1.5; margin: 0 0 28px; font-size: 16px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 15px 16px; margin-bottom: 12px; border-radius: 14px;
    text-decoration: none; font-weight: 800; font-size: 16px; color: var(--navy);
  }
  .ios { background: var(--cream); }
  .android { background: var(--lime); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .hint { font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/harfogram_wordmark_cinzel.svg" alt="Harfogram">
    <p id="lead">Arkadaşlarınla, yapay zekâya karşı ya da aynı telefonda oynanan kelime oyunu.</p>
    <a id="ios" class="btn ios" href="https://apps.apple.com/app/harfogram/id6776008958">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 12.54c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.42-.14-2.76.83-3.48.83-.71 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.9 1.15 9.16.76 1.1 1.67 2.34 2.85 2.3 1.14-.05 1.57-.74 2.95-.74 1.38 0 1.77.74 2.98.71 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.65zM14.77 5.5c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.67-1.09 1.76-.96 2.79 1.02.08 2.06-.52 2.69-1.26z"/></svg>
      <span id="iosLabel">App Store'dan indir</span>
    </a>
    <a id="android" class="btn android" href="https://play.google.com/store/apps/details?id=com.gurcanstudio.harfogram">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.4 13 11.8 3.6 21.2c-.36-.2-.6-.6-.6-1.1V3.5c0-.5.24-.9.6-1.1zM16.3 8.7 13 11.8 3.9 2.1c.1 0 .2.05.3.1l12.1 6.5zM20.4 11c.6.34.6 1.66 0 2L16.3 15.3 13 11.8l3.3-3.5L20.4 11zM16.3 15.3 4.2 21.8c-.1.05-.2.1-.3.1L13 11.8l3.3 3.5z"/></svg>
      <span id="androidLabel">Google Play'den indir</span>
    </a>
    <p id="hint" class="hint" hidden>Mağazaya yönlendiriliyorsun…</p>
  </main>
  <script>
    (function () {
      // App Store Connect → Analiz → Kaynaklar → Kampanyalar → "Kampanya bağlantısı oluştur"daki pt değeri.
      // Gizli değildir (herkese açık bağlantılarda görünür); boşsa yalnızca ct gönderilir.
      var APPLE_PT = "128976157";
      var APP_STORE = "https://apps.apple.com/app/apple-store/id6776008958";
      var PLAY = "https://play.google.com/store/apps/details?id=com.gurcanstudio.harfogram";

      var params = new URLSearchParams(location.search);
      var src = (params.get("k") || "site").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 32) || "site";
      var camp = (params.get("c") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 32);

      var ios = APP_STORE + "?mt=8&ct=" + encodeURIComponent(camp ? src + "-" + camp : src)
              + (APPLE_PT ? "&pt=" + encodeURIComponent(APPLE_PT) : "");
      var ref = "utm_source=" + src + "&utm_medium=social" + (camp ? "&utm_campaign=" + camp : "");
      var android = PLAY + "&referrer=" + encodeURIComponent(ref);
      document.getElementById("ios").href = ios;
      document.getElementById("android").href = android;

      if (!/^tr\b/i.test(navigator.language || "")) {
        document.documentElement.lang = "en";
        document.getElementById("lead").textContent = "A word game to play with friends, against the AI or on one phone.";
        document.getElementById("iosLabel").textContent = "Download on the App Store";
        document.getElementById("androidLabel").textContent = "Get it on Google Play";
        document.getElementById("hint").textContent = "Taking you to the store…";
      }

      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (isIOS || isAndroid) {
        document.getElementById("hint").hidden = false;
        location.replace(isIOS ? ios : android);
      }
    })();
  </script>
</body>
</html>
